name: Deploy Fullstack App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build and Push Backend
      - name: Build & Push Backend
        run: |
          docker build -t xabhi/ugc-backend:latest ./Backend
          docker push xabhi/ugc-backend:latest

      # Build and Push Frontend
      - name: Build & Push Frontend
        run: |
          docker build \
            --build-arg VITE_CLERK_PUBLISHABLE_KEY=${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }} \
            --build-arg VITE_BASEURL=${{ secrets.VITE_BASEURL }} \
            -t xabhi/ugc-frontend:latest ./Frontend

          docker push xabhi/ugc-frontend:latest

      # Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull xabhi/ugc-backend:latest
            docker pull xabhi/ugc-frontend:latest

            docker rm -f backend || true
            docker rm -f frontend || true

            docker run -d \
              --name backend \
              --restart always \
              -p 5000:5000 \
              --env-file /home/ubuntu/backend.env \
              xabhi/ugc-backend:latest

            docker run -d \
              --name frontend \
              --restart always \
              -p 5173:5173 \
              xabhi/ugc-frontend:latest

            docker image prune -af